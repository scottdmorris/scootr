<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>scootr's laboratory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

  :root {
    --off-white: #e8e4dc;
    --dim: rgba(232, 228, 220, 0.7);
    --dimmer: rgba(232, 228, 220, 0.6);
  }

  html {
    width: 100%;
    height: 100%;
    height: -webkit-fill-available;
    background: #000;
  }

  *, *::before, *::after {
    cursor: none !important;
  }

  body {
    width: 100%;
    min-height: 100%;
    min-height: -webkit-fill-available;
    overflow: hidden;
    background: #000;
    cursor: none;
  }

  @media (pointer: coarse) {
    body { cursor: auto; }
    #cod { display: none; }
  }

  /* COD CROSSHAIR */
  #cod {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    width: 0; height: 0;
  }
  #cod span {
    position: absolute;
    background: #ffffff;
    transform: translate(-50%, -50%);
    transition: transform 0.08s ease, opacity 0.08s ease;
  }
  #cod .top    { width: 1.5px; height: 8px;  top: -12px; left: 0; }
  #cod .bottom { width: 1.5px; height: 8px;  top:  12px; left: 0; }
  #cod .left   { width: 8px;   height: 1.5px; top: 0; left: -12px; }
  #cod .right  { width: 8px;   height: 1.5px; top: 0; left:  12px; }
  #cod .dot    { width: 3px;   height: 3px; border-radius: 50%; top: 0; left: 0; }

  /* hitmarker flash */
  #cod.hit .top    { transform: translate(-50%, -50%) translateY(-4px); background: rgba(255,220,100,0.95); }
  #cod.hit .bottom { transform: translate(-50%, -50%) translateY(4px);  background: rgba(255,220,100,0.95); }
  #cod.hit .left   { transform: translate(-50%, -50%) translateX(-4px); background: rgba(255,220,100,0.95); }
  #cod.hit .right  { transform: translate(-50%, -50%) translateX(4px);  background: rgba(255,220,100,0.95); }
  #cod.hit .dot    { background: rgba(255,220,100,0.95); transform: translate(-50%,-50%) scale(2); }

  /* VIDEO LAYER */
  #bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 3s ease;
    filter: brightness(0.35) contrast(1.1) saturate(0.6);
    z-index: 0;
    /* prevents mobile video from going fullscreen on tap */
    pointer-events: none;
  }
  #bg-video.loaded { opacity: 1; }

  /* INTRO — interstellar approach */
  #space {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
    opacity: 1;
    transition: opacity 2.5s ease;
  }
  body.revealed #space { opacity: 0; }

  /* GRAIN OVERLAY */
  #grain {
    position: fixed;
    inset: -50%;
    width: 200%;
    height: 200%;
    z-index: 1;
    pointer-events: none;
    opacity: 0.28;
    mix-blend-mode: overlay;
    animation: grain-shift 0.12s steps(1) infinite;
  }
  @keyframes grain-shift {
    0%   { transform: translate(0, 0); }
    10%  { transform: translate(-3%, -4%); }
    20%  { transform: translate(4%, 2%); }
    30%  { transform: translate(-2%, 5%); }
    40%  { transform: translate(5%, -3%); }
    50%  { transform: translate(-4%, 4%); }
    60%  { transform: translate(3%, -5%); }
    70%  { transform: translate(-5%, 2%); }
    80%  { transform: translate(2%, 4%); }
    90%  { transform: translate(-3%, -2%); }
    100% { transform: translate(4%, -4%); }
  }

  /* VIGNETTE */
  #vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse at center,
      transparent 30%,
      rgba(0,0,0,0.4) 65%,
      rgba(0,0,0,0.85) 100%
    );
  }

  /* CONTENT */
  #content {
    position: fixed;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    padding-bottom: calc(2rem + env(safe-area-inset-bottom));
    text-align: center;
  }

  #site-label {
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    letter-spacing: 0.35em;
    color: var(--dimmer);
    text-transform: uppercase;
    margin-bottom: 2.5rem;
    opacity: 0;
  }
  body.revealed #site-label { animation: fade-up 1.2s ease 0.4s forwards; }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(2.8rem, 7vw, 5.5rem);
    color: var(--off-white);
    letter-spacing: 0.06em;
    line-height: 1;
    opacity: 0;
  }
  body.revealed h1 { animation: fade-up 1.4s ease 0.2s forwards; }

  h1 em {
    font-style: italic;
    font-weight: 300;
  }

  #tagline {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(0.85rem, 2vw, 1.05rem);
    color: var(--dimmer);
    letter-spacing: 0.12em;
    margin-top: 1.2rem;
    opacity: 0;
  }
  body.revealed #tagline { animation: fade-up 1.4s ease 0.6s forwards; }

  #divider {
    width: 1px;
    height: 48px;
    background: linear-gradient(to bottom, transparent, var(--dimmer), transparent);
    margin: 2.5rem auto;
    opacity: 0;
  }
  body.revealed #divider { animation: fade-up 1s ease 1s forwards; }

  #projects {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    opacity: 0;
  }
  body.revealed #projects { animation: fade-up 1.2s ease 1.1s forwards; }

  #projects li {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    justify-content: center;
  }

  #projects li::before {
    content: '';
    display: block;
    width: 18px;
    height: 1px;
    background: var(--dimmer);
    flex-shrink: 0;
  }

  #projects a {
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    letter-spacing: 0.28em;
    color: var(--dim);
    text-decoration: none;
    text-transform: uppercase;
    transition: color 0.3s ease, letter-spacing 0.3s ease;
    position: relative;
  }

  #projects a:hover {
    color: var(--off-white);
    letter-spacing: 0.35em;
  }

  /* coming soon items */
  #projects .soon {
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    letter-spacing: 0.28em;
    color: var(--dimmer);
    text-transform: uppercase;
    cursor: none;
  }

  #projects .soon::after {
    content: ' ·';
    font-size: 9px;
    color: rgba(232,228,220,0.25);
  }

  #countdown {
    font-family: 'Courier Prime', monospace;
    font-size: 9px;
    letter-spacing: 0.25em;
    color: var(--dim);
    margin-top: 0.6rem;
    text-align: center;
    opacity: 0;
  }
  body.revealed #countdown { animation: fade-up 1.2s ease 1.1s forwards; }

  /* FOOTER */
  #footer {
    position: fixed;
    bottom: calc(2rem + env(safe-area-inset-bottom));
    right: 2rem;
    z-index: 3;
    opacity: 0;
  }
  body.revealed #footer { animation: fade-up 1s ease 1.6s forwards; }

  /* replay intro */
  #replay {
    position: fixed;
    bottom: calc(2rem + env(safe-area-inset-bottom));
    left: 2rem;
    z-index: 3;
    font-family: 'Courier Prime', monospace;
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(232,228,220,0.25);
    background: none;
    border: none;
    padding: 0;
    opacity: 0;
    pointer-events: none;
    transition: color 0.3s;
  }
  body.revealed #replay { animation: fade-up 1s ease 1.6s forwards; pointer-events: auto; }
  #replay:hover, #replay:focus-visible { color: rgba(232,228,220,0.6); outline: none; }

  #footer p {
    font-family: 'Courier Prime', monospace;
    font-size: 9px;
    letter-spacing: 0.3em;
    color: rgba(232,228,220,0.15);
    text-transform: uppercase;
    white-space: nowrap;
  }

  #footer a {
    color: rgba(232,228,220,0.25);
    text-decoration: none;
    transition: color 0.3s;
  }

  #footer a:hover {
    color: rgba(232,228,220,0.6);
  }


  @keyframes fade-up {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }


/* subtle scanlines */
  #scanlines {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
  }
</style>

<script>
  // random flicker — fires every 20-45s, never on a clock
  function doFlicker() {
    const frames = [
      'brightness(2) saturate(3) hue-rotate(20deg)',
      'brightness(0.3) saturate(0) hue-rotate(-20deg)',
      'brightness(2.5) saturate(4) hue-rotate(30deg)',
      'brightness(0.2) saturate(0)',
      'brightness(1.8) saturate(3) hue-rotate(-15deg)',
      'none',
      'brightness(0.3) saturate(0)',
      'brightness(2) saturate(2) hue-rotate(10deg)',
      'none',
    ];
    let i = 0;
    const interval = setInterval(() => {
      document.body.style.filter = frames[i++];
      if (i >= frames.length) { clearInterval(interval); document.body.style.filter = ''; }
    }, 80);
    setTimeout(doFlicker, 5000 + Math.random() * 4000);
  }
  // first fire: wait until intro is done AND video is on the blue side (~3-4s)
  function waitForBlue() {
    const t = document.getElementById('bg-video').currentTime;
    if (document.body.classList.contains('revealed') && t >= 3 && t <= 4.5) { doFlicker(); }
    else { requestAnimationFrame(waitForBlue); }
  }
  requestAnimationFrame(waitForBlue);


  // fade in video — held back until the intro reveals the page
  const vid = document.getElementById('bg-video');
  vid.playbackRate = 0.88;
  window.__showVideo = () => { vid.classList.add('loaded'); vid.playbackRate = 0.88; };

  // COD crosshair
  const cod = document.getElementById('cod');
  window.addEventListener('mousemove', (e) => {
    cod.style.left = e.clientX + 'px';
    cod.style.top = e.clientY + 'px';
  });

  // hitmarker sound
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  let hitBuffer = null;
  fetch('./Hitmarker sound - Sound Effect.mp3')
    .then(r => r.arrayBuffer())
    .then(buf => audioCtx.decodeAudioData(buf))
    .then(decoded => { hitBuffer = decoded; });

  function playHitmarker() {
    if (!hitBuffer) return;
    const source = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    source.buffer = hitBuffer;
    source.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    source.start(audioCtx.currentTime, 0);
    source.stop(audioCtx.currentTime + 0.5);
  }

  window.addEventListener('click', () => {
    playHitmarker();
    cod.classList.add('hit');
    setTimeout(() => cod.classList.remove('hit'), 150);
  });

  // generate grain texture on canvas
  const canvas = document.getElementById('grain');
  const ctx = canvas.getContext('2d');

  function resizeGrain() {
    canvas.width = window.innerWidth * 2;
    canvas.height = window.innerHeight * 2;
    drawGrain();
  }

  function drawGrain() {
    const w = canvas.width, h = canvas.height;
    const imageData = ctx.createImageData(w, h);
    const data = imageData.data;
    for (let i = 0; i < data.length; i += 4) {
      const v = Math.random() > 0.5 ? 255 : 0;
      data[i] = v;
      data[i+1] = v;
      data[i+2] = v;
      data[i+3] = 255;
    }
    ctx.putImageData(imageData, 0, 0);
  }

  resizeGrain();
  window.addEventListener('resize', resizeGrain);

  // countdown to 2026-05-29
  const target = new Date('2026-09-01T00:00:00-05:00');
  const countdownEl = document.getElementById('countdown');
  function updateCountdown() {
    const diff = target - Date.now();
    if (diff <= 0) { countdownEl.textContent = '00:00:00:00'; return; }
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    countdownEl.textContent = `${String(h).padStart(3,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>

<script>
/* ============ INTRO: interstellar warp → homepage ============ */
(() => {
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FORCE = new URLSearchParams(location.search).has('intro');
  let seenThisSession = false;
  try { seenThisSession = !!sessionStorage.getItem('introSeen'); } catch (e) {}

  const cv = document.getElementById('space');
  const sctx = cv.getContext('2d');
  const DPR = Math.min(devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  function sizeCanvas() {
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  sizeCanvas();
  addEventListener('resize', sizeCanvas);

  /* 3D starfield — count scales with viewport, spectral colors */
  const SPECTRA = [
    [200, 216, 255],  // blue-white
    [235, 235, 235],  // white
    [255, 226, 178],  // gold
    [160, 220, 255],  // cyan
    [216, 188, 255],  // violet
    [255, 180, 150],  // ember
  ];
  const NEBULA_HUES = [
    [40, 70, 140],    // deep blue
    [30, 110, 120],   // teal
    [90, 50, 140],    // violet
    [140, 80, 60],    // burnt amber
  ];
  let stars = [], nebulae = [];
  function initStars() {
    const count = Math.min(1300, Math.max(500, Math.round(W * H / 1400)));
    stars = Array.from({ length: count }, () => ({
      x: (Math.random() - 0.5) * 2,
      y: (Math.random() - 0.5) * 2,
      z: Math.random(),
      c: SPECTRA[Math.floor(Math.random() * SPECTRA.length)],
      mag: 0.25 + Math.random() * 0.75,
    }));
    nebulae = Array.from({ length: 5 }, () => ({
      x: (Math.random() - 0.5) * 1.6,
      y: (Math.random() - 0.5) * 1.6,
      z: 0.35 + Math.random() * 0.6,
      r: 0.25 + Math.random() * 0.45,
      hue: NEBULA_HUES[Math.floor(Math.random() * NEBULA_HUES.length)],
    }));
  }

  /* timeline (ms): drift 0-1600, warp builds 1600-4300, supernova 4300, reveal 4750 */
  const T_WARP = 1600, T_NOVA = 4300, T_REVEAL = 4750;
  const FADE_OUT_MS = 2600;   // canvas keeps drawing while it fades into the video

  let t0 = 0, raf = null, revealed = false, revealedAt = 0;

  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const easeInCubic = t => t * t * t;

  /* warp rumble — synthesized on the page's existing AudioContext, no assets.
     Browsers gate audio behind a first interaction with the site, so the
     flight is silent for brand-new visitors and audible once they've
     clicked/tapped anywhere on the domain this session. */
  let audioNodes = null;
  function startWarpAudio() {
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (audioNodes || audioCtx.state !== 'running') return;

      const master = audioCtx.createGain();
      master.gain.value = 0;
      master.connect(audioCtx.destination);

      // looped brownian noise → lowpass = engine rumble
      const len = audioCtx.sampleRate * 2;
      const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) {
        const white = Math.random() * 2 - 1;
        last = (last + 0.02 * white) / 1.02;
        d[i] = last * 3.5;
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buf; noise.loop = true;
      const lp = audioCtx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 120; lp.Q.value = 0.7;
      noise.connect(lp); lp.connect(master);
      noise.start();

      // sub-bass sine underneath
      const osc = audioCtx.createOscillator();
      osc.type = 'sine'; osc.frequency.value = 36;
      const og = audioCtx.createGain(); og.gain.value = 0.4;
      osc.connect(og); og.connect(master);
      osc.start();

      audioNodes = { master, lp, osc, noise, novaFired: false };
    } catch (e) {}
  }

  function updateWarpAudio(warp, el) {
    if (!audioNodes) return;
    const n = audioNodes;
    const t = audioCtx.currentTime;
    if (!n.novaFired) {
      n.master.gain.setTargetAtTime(0.04 + warp * 0.3, t, 0.1);
      n.lp.frequency.setTargetAtTime(100 + warp * 700, t, 0.15);
      n.osc.frequency.setTargetAtTime(34 + warp * 38, t, 0.15);
    }
    if (el > T_NOVA && !n.novaFired) {
      n.novaFired = true;
      // detonation: spike, then everything sinks into silence
      n.master.gain.cancelScheduledValues(t);
      n.master.gain.setValueAtTime(Math.max(0.3, n.master.gain.value), t);
      n.master.gain.exponentialRampToValueAtTime(0.5, t + 0.08);
      n.master.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);
      n.lp.frequency.setValueAtTime(900, t);
      n.lp.frequency.exponentialRampToValueAtTime(60, t + 2.2);
      n.osc.frequency.setValueAtTime(70, t);
      n.osc.frequency.exponentialRampToValueAtTime(24, t + 2.0);
      setTimeout(stopWarpAudio, 2600);
    }
  }

  function stopWarpAudio() {
    if (!audioNodes) return;
    try {
      audioNodes.noise.stop();
      audioNodes.osc.stop();
      audioNodes.master.disconnect();
    } catch (e) {}
    audioNodes = null;
  }

  function speedAt(el) {
    if (el < T_WARP) return 0.012 + easeInCubic(el / T_WARP) * 0.06;
    if (el < T_NOVA) {
      const p = (el - T_WARP) / (T_NOVA - T_WARP);
      return 0.07 + p * p * 3.4;               // keeps accelerating until the nova
    }
    const p = Math.min(1, (el - T_NOVA) / 900);
    return 3.5 * Math.pow(1 - p, 3) + 0.008;   // hard decel out of the flash
  }

  function frame(now) {
    const el = now - t0;
    const speed = speedAt(el);
    const warp = Math.min(1, Math.max(0, (speed - 0.15) / 3));  // 0 drift → 1 hyperspeed
    const cx = W / 2, cy = H / 2;
    const focal = Math.min(W, H) * 0.9;

    updateWarpAudio(warp, el);

    // motion blur: at speed, fade the previous frame instead of clearing it
    sctx.globalCompositeOperation = 'source-over';
    if (warp > 0.05) {
      sctx.fillStyle = 'rgba(0,0,0,' + (0.45 - warp * 0.28) + ')';
      sctx.fillRect(0, 0, W, H);
    } else {
      sctx.clearRect(0, 0, W, H);
    }

    let shx = 0, shy = 0;
    if (warp > 0.3 && el < T_NOVA + 300) {
      const k = warp * 4;
      shx = (Math.random() - 0.5) * k;
      shy = (Math.random() - 0.5) * k;
    }

    // everything luminous draws additive
    sctx.globalCompositeOperation = 'lighter';

    // nebulae — colored washes rushing past with parallax
    for (const n of nebulae) {
      n.z -= speed * 0.004;
      if (n.z <= 0.05) {
        n.z += 1;
        n.x = (Math.random() - 0.5) * 1.6;
        n.y = (Math.random() - 0.5) * 1.6;
        n.hue = NEBULA_HUES[Math.floor(Math.random() * NEBULA_HUES.length)];
      }
      const nx = cx + (n.x / n.z) * focal * 0.5 + shx;
      const ny = cy + (n.y / n.z) * focal * 0.5 + shy;
      const nr = (n.r * Math.min(W, H)) / n.z * 0.5;
      const a = Math.min(0.16, (1 - n.z) * 0.12 + warp * 0.06);
      const ng = sctx.createRadialGradient(nx, ny, 0, nx, ny, nr);
      ng.addColorStop(0, 'rgba(' + n.hue + ',' + a + ')');
      ng.addColorStop(1, 'rgba(' + n.hue + ',0)');
      sctx.fillStyle = ng;
      sctx.beginPath(); sctx.arc(nx, ny, nr, 0, Math.PI * 2); sctx.fill();
    }

    // stars
    const stretch = 1 + warp * 2.2;   // streaks lengthen as warp builds
    for (const s of stars) {
      const zPrev = Math.min(1, s.z + speed * 0.016 * stretch);
      s.z -= speed * 0.016;
      if (s.z <= 0.02) {
        s.x = (Math.random() - 0.5) * 2;
        s.y = (Math.random() - 0.5) * 2;
        s.z = 1;
        continue;
      }
      const px = cx + (s.x / s.z) * focal + shx;
      const py = cy + (s.y / s.z) * focal + shy;
      if (px < -80 || px > W + 80 || py < -80 || py > H + 80) continue;

      const bright = s.mag * Math.min(1, (1 - s.z) * 1.7);
      const c = s.c;

      if (speed > 0.15) {
        const qx = cx + (s.x / zPrev) * focal + shx;
        const qy = cy + (s.y / zPrev) * focal + shy;
        const lw = Math.max(0.5, (1 - s.z) * (1.2 + warp * 1.6));
        // chromatic split at full warp
        if (warp > 0.55 && s.mag > 0.5) {
          sctx.lineWidth = lw;
          sctx.strokeStyle = 'rgba(120,200,255,' + (bright * 0.35) + ')';
          sctx.beginPath(); sctx.moveTo(qx + 1.5, qy); sctx.lineTo(px + 1.5, py); sctx.stroke();
          sctx.strokeStyle = 'rgba(255,120,190,' + (bright * 0.3) + ')';
          sctx.beginPath(); sctx.moveTo(qx - 1.5, qy); sctx.lineTo(px - 1.5, py); sctx.stroke();
        }
        sctx.strokeStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (bright * 0.9) + ')';
        sctx.lineWidth = lw;
        sctx.beginPath(); sctx.moveTo(qx, qy); sctx.lineTo(px, py); sctx.stroke();
      } else {
        const rad = Math.max(0.4, (1 - s.z) * 1.5);
        sctx.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + bright + ')';
        sctx.beginPath(); sctx.arc(px, py, rad, 0, Math.PI * 2); sctx.fill();
        if (s.mag > 0.85 && Math.random() < 0.03) {
          sctx.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.9)';
          sctx.fillRect(px - rad*3, py - 0.4, rad*6, 0.8);
          sctx.fillRect(px - 0.4, py - rad*3, 0.8, rad*6);
        }
      }
    }

    // tunnel-mouth bloom — brightens as warp builds
    if (warp > 0.1) {
      const br = focal * (0.12 + warp * 0.3);
      const bg = sctx.createRadialGradient(cx + shx, cy + shy, 0, cx + shx, cy + shy, br);
      bg.addColorStop(0, 'rgba(190, 215, 255, ' + (warp * 0.30) + ')');
      bg.addColorStop(0.4, 'rgba(150, 180, 235, ' + (warp * 0.12) + ')');
      bg.addColorStop(1, 'rgba(120, 150, 220, 0)');
      sctx.fillStyle = bg;
      sctx.beginPath(); sctx.arc(cx + shx, cy + shy, br, 0, Math.PI * 2); sctx.fill();
    }

    // supernova — white-out burst with expanding shock ring
    if (el > T_NOVA) {
      const p = Math.min(1, (el - T_NOVA) / 1100);
      const flash = p < 0.18 ? p / 0.18 : Math.pow(1 - (p - 0.18) / 0.82, 2);
      const nr = focal * (0.2 + easeOutCubic(p) * 2.2);
      const fg = sctx.createRadialGradient(cx, cy, 0, cx, cy, nr);
      fg.addColorStop(0, 'rgba(255,255,255,' + (flash * 0.95) + ')');
      fg.addColorStop(0.25, 'rgba(220,230,255,' + (flash * 0.55) + ')');
      fg.addColorStop(0.6, 'rgba(170,190,255,' + (flash * 0.18) + ')');
      fg.addColorStop(1, 'rgba(140,160,255,0)');
      sctx.fillStyle = fg;
      sctx.fillRect(0, 0, W, H);
      sctx.strokeStyle = 'rgba(255,255,255,' + (flash * 0.5) + ')';
      sctx.lineWidth = 2 + (1 - p) * 3;
      sctx.beginPath(); sctx.arc(cx, cy, nr * 0.55, 0, Math.PI * 2); sctx.stroke();
    }

    sctx.globalCompositeOperation = 'source-over';

    if (!revealed && el >= T_REVEAL) reveal();
    if (revealed && now - revealedAt > FADE_OUT_MS) {
      raf = null;
      cv.style.display = 'none';
      return;
    }
    raf = requestAnimationFrame(frame);
  }

  function reveal() {
    if (revealed) return;
    revealed = true;
    revealedAt = performance.now();
    document.body.classList.add('revealed');
    window.__showVideo();
  }

  function skip() {
    if (revealed) return;
    t0 = performance.now() - T_REVEAL;
    reveal();
  }

  window.addEventListener('click', skip);
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') skip();
  });

  function restartIntro() {
    revealed = false;
    document.body.classList.remove('revealed');
    vid.classList.remove('loaded');
    cv.style.display = '';
    initStars();
    stopWarpAudio();
    startWarpAudio();   // user just clicked, so audio is unlocked
    t0 = performance.now();
    if (!raf) raf = requestAnimationFrame(frame);
  }

  document.getElementById('replay').addEventListener('click', (e) => {
    e.stopPropagation();   // don't trigger skip or the hitmarker
    restartIntro();
  });

  initStars();
  if (REDUCED || (seenThisSession && !FORCE)) {
    cv.style.display = 'none';
    reveal();
  } else {
    try { sessionStorage.setItem('introSeen', '1'); } catch (e) {}
    startWarpAudio();
    t0 = performance.now();
    raf = requestAnimationFrame(frame);
  }
})();
</script>

</body>
</html>
